appcompat = "1.7.0"
activity = "1.9.3"
swiperefreshlayout = "1.1.0"
splashscreen = "1.0.1"
playServicesLocation = "21.3.0"
work = "2.9.1"
okhttp = "4.12.0"
webkit = "1.12.1"
