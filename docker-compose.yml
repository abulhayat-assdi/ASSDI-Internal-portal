services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # MVP: DB NOT exposed to host/internet — only compose network.
    # For emergency psql: docker compose exec db psql -U $DB_USER $DB_NAME
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Runs once at startup to ensure the storage volume is owned by UID 1001 (nextjs).
  # Needed because Docker named volumes are root-owned on first creation.
  init-storage:
    image: alpine
    command: sh -c "mkdir -p /storage && chown -R 1001:1001 /storage"
    volumes:
      - storage_data:/storage
    restart: "no"

  # PostgREST fronts the `typing_game` Postgres schema only. Internal-only
  # (no published port) — the app container is the sole caller, using the
  # student's own ASM session JWT as the bearer token (see
  # src/lib/typing-game/postgrest-client.ts). No Supabase Auth/GoTrue here;
  # ASM's existing auth is the only identity provider.
  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgresql://authenticator:${PGRST_AUTHENTICATOR_PASSWORD:?PGRST_AUTHENTICATOR_PASSWORD must be set}@db:5432/${DB_NAME}
      PGRST_DB_SCHEMAS: typing_game
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      PGRST_JWT_SECRET_IS_BASE64: "false"
      PGRST_JWT_ROLE_CLAIM_KEY: ".pg_role"
      PGRST_DB_POOL: "10"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundles and into next.config's
        # allowedOrigins/remotePatterns, so it must be right at BUILD time —
        # setting it only at runtime silently leaves the previous domain
        # compiled in. Required, so a missing value fails the build loudly
        # instead of shipping a wrong one.
        NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:?NEXT_PUBLIC_BASE_DOMAIN must be set}
    restart: unless-stopped
    environment:
      # The entrypoint rebuilds both connection URLs from these, percent-encoding
      # the passwords. They have to be real env vars inside the container, not
      # just compose-time substitutions, or that rebuild silently never runs.
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      # The unprivileged role the server queries as, so RLS is enforced.
      # docker-entrypoint.sh rebuilds DATABASE_URL from these; the value above
      # survives only as BOOTSTRAP_DATABASE_URL for migrations.
      APP_DB_USER: ${APP_DB_USER:-asm_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SETUP_SECRET: ${SETUP_SECRET:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      LOCAL_STORAGE_PATH: /app/storage
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:?NEXT_PUBLIC_BASE_DOMAIN must be set}
      # Server-side tenant routing reads this one at runtime.
      BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN}
      SAAS_OWNER_EMAIL: ${SAAS_OWNER_EMAIL}
      # Authenticator role password for the typing-game Postgres bootstrap
      # (0039_auth_shim.sql creates the role); also consumed by the postgrest
      # service above. Same value both places.
      PGRST_AUTHENTICATOR_PASSWORD: ${PGRST_AUTHENTICATOR_PASSWORD}
      POSTGREST_URL: http://postgrest:3000
    depends_on:
      db:
        condition: service_healthy
      init-storage:
        condition: service_completed_successfully
      postgrest:
        condition: service_started
    # WARNING: this publishes the app on every host interface, so :3000 is
    # reachable from the internet and bypasses the reverse proxy's TLS.
    # On a plain VPS change this to "127.0.0.1:3000:3000". Under Coolify,
    # Traefik reaches the container over the Docker network instead, so the
    # whole `ports:` block can be dropped in favour of `expose: ["3000"]`.
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
  storage_data:
